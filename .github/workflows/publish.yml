name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A9D183: ${{ secrets.A9D183 }}
          BEA040: ${{ secrets.BEA040 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A9D183', ''), os.environ.get('BEA040', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 7ed0b48fb43eed71e811f5796eeae1c02fa3af99995a9d55 -->', a)
          if b:
              patched = patched.replace('<!-- afe64fb9732d2e62 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
